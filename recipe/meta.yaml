{% set name = "PyGSP" %}
{% set version = "0.6.1" %}
{% set sha256 = "79b4826485f73cbe6060e0a84f0cab44c2a32c4b3887d8d603bef23c10ab7365" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  build:
    - python
    - setuptools
  run:
    - python
    - numpy
    - scipy

test:
  imports:
    - pygsp
  requires:
    - matplotlib-base
    - scikit-image
    - pyflann  # [not win]
  commands:
    - python -m unittest pygsp.tests.test_graphs.suite  # [not win]
    - python -m unittest pygsp.tests.test_filters.suite
    - python -m unittest pygsp.tests.test_utils.suite

about:
  home: https://github.com/epfl-lts2/pygsp
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'Graph Signal Processing in Python'
  doc_url: https://pygsp.readthedocs.io/
  dev_url: https://github.com/epfl-lts2/pygsp

extra:
  recipe-maintainers:
    - mdeff
